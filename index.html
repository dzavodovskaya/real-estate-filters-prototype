ight:1px;background:#edf0f6;margin:0 20px 24px}.secondary{font-size:13px;color:#70809b;padding:0 20px 12px;margin-top:-3px}.brand{position:absolute;right:0;top:90px;width:46px;height:52px;overflow:hidden;pointer-events:none}.brand:before,.brand:after{content:'';position:absolute;right:-12px;width:65px;height:15px;transform:rotate(-25deg);border-radius:12px;background:#ff6b19}.brand:after{top:16px;background:#ffbb17}.details{margin:12px 20px 0;font-size:12px;color:#8290a9} @media(min-width:600px){body{padding:20px}.phone{border-radius:26px;overflow:hidden}.top{border-radius:26px 26px 0 0}.foot{bottom:0}}

ackground-repeat:no-repeat;mix-blend-mode:normal}.renov-art:before{display:none}.renov-name{bottom:13px}.renov .check{z-index:1}.renov button{flex:0 0 calc((100% - 20px)/3);min-width:0;height:auto;aspect-ratio:0.62}.renov-art{height:auto;bottom:39px}.renov-name{font-size:12px;bottom:10px;left:8px;right:6px}.row .icon{width:44px;height:44px;flex:0 0 44px;background:transparent;border-radius:0}.row .icon img{display:block;width:100%;height:100%;object-fit:contain;transform:scale(1.32)}.row .fields{min-width:0}.row select{appearance:none;-webkit-appearance:none;cursor:pointer}.row-chevron{width:13px;flex:0 0 13px;text-align:center;font-size:20px;line-height:1;color:#243d60}</style></head><body><main class="phone"><header class="top"><span class="x">×</span><strong>Фильтры</strong><button class="reset" id="reset">Сбросить</button></header><div class="intro"><h1>Что ищете?</h1></div><div class="deal" id="deal"><button class="active">Купить</button><button>Снять</button><button>Посуточно</button></div><section class="section"><div class="type-wrap"><div class="carousel" id="types" aria-label="Тип недвижимости"></div><button class="next-types" id="nextTypes" aria-label="Показать следующие типы недвижимости"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></section><div class="line"></div><section class="section"><div class="heading"><h2>Где ищем?</h2></div><div class="panel"><div class="row"><span class="icon icon-pin" aria-hidden="true"><img src="pin.png" alt=""></span><div class="fields"><label for="location">Расположение</label><input id="location" value="Санкт-Петербург" aria-label="Расположение"></div><span class="row-chevron" aria-hidden="true">›</span></div><div class="row"><span class="icon icon-clock" aria-hidden="true"><img src="clock.png" alt=""></span><div class="fields"><label for="travel">Время в пути</label><select id="travel"><option value="">Не важно</option><option>До 15 минут</option><option>До 30 минут</option><option>До 45 минут</option><option>До 60 минут</option></select></div><span class="row-chevron" aria-hidden="true">›</span></div></div><p class="details">Укажите город или адрес и выберите время в пути</p></section><section class="section"><div class="heading"><h2>Сколько комнат?</h2><small>Можно несколько</small></div><div class="carousel rooms" id="rooms"><button>Студия</button><button>1</button><button>2</button><button>3</button><button>4</button><button>5+</button></div></section><section class="section" id="repairSection" hidden><div class="heading"><h2>Ремонт и отделка</h2><small>Можно несколько</small></div><div id="secondaryGroup" hidden><p class="secondary" id="repairLabel"></p><div class="carousel renov" id="renov"><button aria-pressed="false"><span class="renov-art" style="background-position:0% 100%"></span><span class="renov-name">Хороший</span><span class="check">✓</span></button><button aria-pressed="false"><span class="renov-art" style="background-position:50% 100%"></span><span class="renov-name">Бабушкин</span><span class="check">✓</span></button><button aria-pressed="false"><span class="renov-art" style="background-position:100% 100%"></span><span class="renov-name">Дизайнерский</span><span class="check">✓</span></button></div></div><div id="newGroup" hidden><p class="secondary">В новостройке</p><div class="carousel renov" id="finish"><button aria-pressed="false"><span class="renov-art" style="background-position:0% 0%"></span><span class="renov-name">Без отделки</span><span class="check">✓</span></button><button aria-pressed="false"><span class="renov-art" style="background-position:50% 0%"></span><span class="renov-name">Предчистовая</span><span class="check">✓</span></button><button aria-pressed="false"><span class="renov-art" style="background-position:100% 0%"></span><span class="renov-name">Готовый ремонт</span><span class="check">✓</span></button></div></div></section><div class="toast" id="toast"></div><footer class="foot"><button class="primary" id="show">Смотреть 138 600 объявлений</button><button class="save" id="save">♡ &nbsp; Сохранить поиск</button></footer></main><script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const catalog={
 'Купить':[{v:'Новостройка',a:'v2',p:'0% 0%'},{v:'Вторичка',a:'v2',p:'100% 0%'},{v:'Дом',a:'v3',p:'0% 0%'},{v:'Гараж',a:'v3',p:'100% 0%'},{v:'Офис',a:'v3',p:'0% 100%'}],
 'Снять':[{v:'Квартира',a:'v2',p:'100% 0%'},{v:'Комната',a:'v3',p:'100% 100%'},{v:'Дом',a:'v3',p:'0% 0%'},{v:'Гараж',a:'v3',p:'100% 0%'},{v:'Офис',a:'v3',p:'0% 100%'}],
 'Посуточно':[{v:'Квартира',a:'v2',p:'100% 0%'},{v:'Отель',a:'v2',p:'0% 100%'},{v:'Дом',a:'v2',p:'100% 100%'}]
};
let mode='Купить',selected={'Купить':new Set(),'Снять':new Set(),'Посуточно':new Set()},saved=false;
function renderTypes(animate=true){const el=$('#types');el.innerHTML=catalog[mode].map((x,i)=>`<button class="type ${selected[mode].has(x.v)?'active':''} ${animate?'enter':''}" style="--i:${i}" data-val="${x.v}" aria-pressed="${selected[mode].has(x.v)}"><span class="art ${x.a||''}" style="background-position:${x.p}"></span><span class="check">✓</span><span class="name">${x.v}</span></button>`).join('');el.scrollLeft=0;requestAnimationFrame(syncArrow)}
function updateRepair(){const choices=selected[mode];const hasNew=choices.has('Новостройка');const hasOld=['Вторичка','Дом','Квартира','Комната'].some(v=>choices.has(v));$('#repairSection').hidden=!(hasNew||hasOld);$('#newGroup').hidden=!hasNew;$('#secondaryGroup').hidden=!hasOld;const names=[];if(choices.has('Вторичка'))names.push('во вторичке');if(choices.has('Квартира'))names.push('в квартире');if(choices.has('Комната'))names.push('в комнате');if(choices.has('Дом'))names.push('в доме');const text=names.join(' и ');$('#repairLabel').textContent=text?text[0].toUpperCase()+text.slice(1):'';[['#newGroup','#finish'],['#secondaryGroup','#renov']].forEach(([group,list])=>{if($(group).hidden)$$(list+' button.active').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-pressed','false')})})}
function count(){let n=220000,t=selected[mode].size,r=$$('#rooms .active').length,f=$$('#renov .active, #finish .active').length;n*=mode==='Купить'?1:mode==='Снять'?.58:.22;n*=t?Math.min(1,.63+(t-1)*.13):1;n*=r?Math.min(1,.62+(r-1)*.14):1;n*=f?Math.min(1,.72+(f-1)*.08):1;if($('#travel').value)n*=.72;return Math.round(n/100)*100}
function update(){let n=count().toLocaleString('ru-RU');$('#show').textContent=`Смотреть ${n} объявлений`;saved=false;$('#save').innerHTML='♡ &nbsp; Сохранить поиск'}
function toast(t){let el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(window.timer);window.timer=setTimeout(()=>el.style.display='none',2800)}
$('#deal').onclick=e=>{if(e.target.tagName==='BUTTON'&&e.target.textContent!==mode){mode=e.target.textContent;$$('#deal button').forEach(b=>b.classList.toggle('active',b===e.target));renderTypes();updateRepair();update()}};
$('#types').onclick=e=>{if(dragged){dragged=false;return}let b=e.target.closest('button');if(!b)return;let v=b.dataset.val;selected[mode].has(v)?selected[mode].delete(v):selected[mode].add(v);b.classList.toggle('active',selected[mode].has(v));b.setAttribute('aria-pressed',String(selected[mode].has(v)));updateRepair();update()};
['rooms','renov','finish'].forEach(g=>$('#'+g).onclick=e=>{let b=e.target.closest('button');if(b){b.classList.toggle('active');b.setAttribute('aria-pressed',String(b.classList.contains('active')));update()}});
$('#travel').onchange=update;$('#location').oninput=update;
$('#reset').onclick=()=>{mode='Купить';selected={'Купить':new Set(),'Снять':new Set(),'Посуточно':new Set()};$$('#deal button').forEach((b,i)=>b.classList.toggle('active',i===0));['rooms','renov','finish'].forEach(g=>$$('#'+g+' button').forEach(b=>b.classList.remove('active')));$('#location').value='Санкт-Петербург';$('#travel').value='';renderTypes();update();toast('Фильтры сброшены')};
$('#save').onclick=()=>{saved=!saved;$('#save').innerHTML=saved?'♥ &nbsp; Поиск сохранён':'♡ &nbsp; Сохранить поиск';if(saved){try{localStorage.setItem('savedSearch',JSON.stringify({deal:mode,types:[...selected[mode]],rooms:$$('#rooms .active').map(x=>x.textContent),renov:$$('#renov .active, #finish .active').map(x=>x.textContent),location:$('#location').value,travel:$('#travel').value}))}catch(e){}toast('Поиск сохранён на этом устройстве')}};

const track=$('#types'),arrow=$('#nextTypes');let startX=0,startScroll=0,dragging=false,dragged=false;
function syncArrow(){arrow.hidden=track.scrollWidth-track.clientWidth-track.scrollLeft<3} 
track.addEventListener('scroll',syncArrow,{passive:true});window.addEventListener('resize',syncArrow);
arrow.addEventListener('click',()=>track.scrollBy({left:260,behavior:'smooth'}));
track.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;dragging=true;dragged=false;startX=e.clientX;startScroll=track.scrollLeft;track.classList.add('dragging')});
window.addEventListener('pointermove',e=>{if(!dragging)return;let d=e.clientX-startX;if(Math.abs(d)>5)dragged=true;if(dragged){track.scrollLeft=startScroll-d;e.preventDefault()}});
window.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;track.classList.remove('dragging');if(dragged)setTimeout(()=>{dragged=false},80)});
$('#show').onclick=()=>toast('Это прототип: список объявлений пока не подключён');renderTypes(false);updateRepair();update();
</script></body></html>
